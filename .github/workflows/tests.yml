name: Tests

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel-ai:
          - "^0.1.2"
          - "^0.2.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-all

      - name: Select Laravel AI version
        run: composer require laravel/ai:${{ matrix.laravel-ai }} --no-update --no-interaction

      - name: Update dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run Pint
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Check 100% coverage for src
        if: matrix.laravel-ai == '^0.2.6'
        run: composer test:coverage
